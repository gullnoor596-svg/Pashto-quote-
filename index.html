<style>

body{
  margin:0;
  background:#0f172a;
  color:white;
}

/* TITLE */
.header{
  text-align:center;
  padding:15px;
  font-size:32px;
  font-weight:700;

  font-family:'Noto Nastaliq Urdu', serif;
}

/* SEARCH */
.searchBox{
  display:flex;
  justify-content:center;
  padding:10px;
}

input{
  width:80%;
  padding:10px;
  border:none;
  border-radius:8px;
  outline:none;
  text-align:center;

  font-family:'Noto Naskh Arabic', serif;
}

/* CARD */
.card{

  margin:12px;

  padding:18px;

  border-radius:18px;

  background:
  linear-gradient(
  135deg,
  #1e293b,
  #111827);

  border:1px solid
  rgba(255,255,255,.08);

  box-shadow:
  0 6px 18px rgba(0,0,0,.25);

  transition:
  transform .25s ease,
  box-shadow .25s ease;

  will-change: transform;

}

/* Smooth hover only */
.card:hover{

  transform:
  translateY(-4px);

  box-shadow:
  0 10px 25px rgba(0,0,0,.35);

}

/* Simple fade-in (lightweight) */
.card{

  animation:fadeIn .25s ease;

}

@keyframes fadeIn{

  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

.card:hover{
  transform:translateY(-3px);
}

/* PASHTO TEXT */
.pashtoText{
  font-family:'Scheherazade New','Noto Naskh Arabic', serif;
  direction:rtl;
  text-align:right;
  font-size:14px;
  font-weight:700;
  line-height:2.1;
}

/* URDU TEXT */
.urduText{
  direction:rtl;
  text-align:right;

  font-family:'Noto Nastaliq Urdu', serif;

  font-size:15px; /* URDU SIZE */

  line-height:2.2;

  margin-top:6px;
}

/* BUTTON */
button{
  margin-top:10px;
  padding:6px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

/* COPY */
.copy{

  width:300px;

  margin:12px auto 0 auto;

  display:block;

  padding:8px;

  border:none;

  border-radius:5px;

  cursor:pointer;

  color:#fff;

  font-size:15px;

  font-weight:700;

  background:#22c55e;

  box-shadow:0 4px 12px rgba(34,197,94,.25);

}

/* No animation, only simple hover */
.copy:hover{
  background:#16a34a;
}

/* clean click feel */
.copy:active{
  background:#15803d;
}

@keyframes gradientMove{

  0%{
    background-position:0% 50%;
  }

  50%{
    background-position:100% 50%;
  }

  100%{
    background-position:0% 50%;
  }

}

@keyframes shine{

  100%{
    left:160%;
  }

}

/* LOAD MORE */
.load{
  background:#3b82f6;
  color:white;

  width:50%;
  margin:15px auto;

  display:block;

  padding:10px;

  border-radius:8px;
}

/* LIST */
#list{
  padding:5px;
}

</style>

// ===== AUTO DATA =====
const autoQuotes =
Array.from({length:50},(_,i)=>({

  id:i+100,

  show:"یہ قول نمبر "+(i+1),

  show2:"یہ دوسری لائن "+(i+1),

  copy:"text "+(i+1)

}));

// ===== MERGE =====
const quotes =
[...customQuotes, ...autoQuotes];

// ===== SETTINGS =====
let page = 1;

let limit = 20;

let filtered = [...quotes];

// ===== RENDER =====
function render(){

  let list =
  document.getElementById("list");

  list.innerHTML = "";

  let data =
  filtered.slice(0, page * limit);

  data.forEach(q=>{

    let div =
    document.createElement("div");

    div.className = "card";

    div.innerHTML = `

      <div class="pashtoText">
      ${q.show}
      </div>

      <div class="urduText">
      ${q.show2}
      </div>

      <button class="copy"
      onclick="copyText('${q.copy}')">
      Copy
      </button>

    `;

    list.appendChild(div);

  });
}

// ===== COPY =====
function copyText(text){

  navigator.clipboard
  .writeText(text);

  alert("Copied: " + text);
}

// ===== LOAD MORE =====
function loadMore(){

  page++;

  render();
}

// ===== SEARCH =====
function filterData(){

  let val =
  document.getElementById("search")
  .value
  .toLowerCase();

  filtered = quotes.filter(q =>

    q.show.toLowerCase().includes(val) ||

    q.show2.toLowerCase().includes(val) ||

    q.copy.toLowerCase().includes(val)

  );

  page = 1;

  render();
}

// ===== INIT =====
render();

</script>
